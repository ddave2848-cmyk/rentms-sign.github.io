<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>RentMS - Formal Digital Lease Execution</title>
  <style>
    :root { --primary: #2563eb; --emerald: #059669; --bg: #f8fafc; --card: #ffffff; --text: #0f172a; --border: #cbd5e1; }
    body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 16px; line-height: 1.5; }
    .card { background: var(--card); border-radius: 14px; padding: 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); max-width: 600px; margin: 0 auto; border: 1px solid #e2e8f0; }
    h2 { margin-top: 0; color: var(--primary); font-size: 1.35rem; text-align: center; border-bottom: 2px solid #eff6ff; padding-bottom: 12px; }
    
    /* Document Styling */
    .document-paper { background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 20px; max-height: 280px; overflow-y: auto; margin: 16px 0; font-size: 0.88rem; color: #334155; }
    .document-paper h4 { margin-top: 0; color: #1e293b; text-transform: uppercase; font-size: 0.8rem; letter-spacing: 0.05em; border-bottom: 1px solid #e2e8f0; padding-bottom: 4px; }
    .doc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px 0; background: #f8fafc; padding: 10px; border-radius: 6px; border: 1px solid #f1f5f9; font-size: 0.85rem; }
    .doc-grid span { color: #64748b; }
    .doc-grid strong { color: #0f172a; }

    .tap-zone { margin-top: 20px; border: 2px dashed var(--primary); border-radius: 12px; padding: 24px 16px; text-align: center; background: #eff6ff; user-select: none; -webkit-user-select: none; touch-action: manipulation; cursor: pointer; }
    .tap-zone:active { background: #dbeafe; transform: scale(0.99); }
    .tap-counter { font-weight: 800; color: var(--primary); margin-top: 6px; font-size: 1.05rem; }
    
    .modal-backdrop { display: none; position: fixed; inset: 0; background: rgba(15,23,42,0.72); align-items: center; justify-content: center; padding: 16px; z-index: 100; }
    .modal { background: #fff; padding: 24px; border-radius: 14px; width: 100%; max-width: 340px; text-align: center; }
    .captcha-box { font-size: 1.45rem; font-weight: 800; background: #f1f5f9; padding: 12px; border-radius: 8px; margin: 14px 0; letter-spacing: 1px; }
    input[type="number"] { width: 80%; padding: 10px; font-size: 1.15rem; border: 2px solid #cbd5e1; border-radius: 8px; text-align: center; }
    button { margin-top: 14px; width: 100%; padding: 13px; background: var(--primary); color: white; font-weight: 700; border: none; border-radius: 8px; font-size: 0.98rem; cursor: pointer; }
    .btn-emerald { background: var(--emerald); }
    .sealed-banner { display: none; margin-top: 20px; padding: 16px; border-radius: 10px; background: #ecfdf5; border: 1px solid #a7f3d0; color: #065f46; font-weight: 600; text-align: center; }
  </style>
</head>
<body>

<div class="card" id="mainCard">
  <h2 id="pageTitle">Residential Lease Agreement</h2>
  
  <div id="contractDetails">Loading document terms...</div>

  <div id="tapBox" class="tap-zone">
    <strong>RAPID TRIPLE-TAP HERE TO SIGN</strong>
    <div style="font-size: 0.78rem; color: #475569; margin-top: 4px;">
      By tapping 3 times, you legally execute this lease under the IT Act, 2000.
    </div>
    <div id="tapStatus" class="tap-counter">Taps: 0 / 3</div>
  </div>

  <div id="sealedBanner" class="sealed-banner"></div>
</div>

<!-- Micro-Captcha Modal -->
<div id="captchaModal" class="modal-backdrop">
  <div class="modal">
    <h3 style="margin-top:0;">Confirm Deliberate Intent</h3>
    <p style="font-size:0.86rem; color:#475569;">Solve this challenge to seal your digital signature:</p>
    <div id="mathPrompt" class="captcha-box"></div>
    <input type="number" id="captchaInput" placeholder="Enter sum" inputmode="numeric" />
    <button id="verifyBtn">Seal & Send to Landlord</button>
  </div>
</div>

<script>
  const params = new URLSearchParams(window.location.search);

  // MODE A: LANDLORD TAPPED THE VERIFICATION RETURN LINK ON THEIR PHONE
  const verifyPayload = params.get("verify");
  if (verifyPayload) {
    const deepLink = "rentms://sign-callback?payload=" + encodeURIComponent(verifyPayload);
    document.getElementById("pageTitle").textContent = "Importing Tenant Signature...";
    document.getElementById("tapBox").style.display = "none";
    document.getElementById("contractDetails").innerHTML = `
      <p style="font-size:0.92rem; color:#334155; text-align:center; padding: 20px 0;">
        Tenant's cryptographic Triple-Tap & Micro-Captcha seal verified. Routing directly to your <strong>RentMS</strong> app...
      </p>
      <button class="btn-emerald" onclick="window.location.href='${deepLink}'">
        Open in RentMS App to Apply Hardware Seal
      </button>
    `;
    setTimeout(() => { window.location.href = deepLink; }, 350);
  } else {
    // MODE B: TENANT SIGNING CEREMONY - RENDERING FORMAL DOCUMENT VIEW
    const rawB64 = params.get("contract") || "";
    let contract = { tenantId: 1, name: "Resident", room: "N/A", rent: 0, deposit: 0, estamp: "N/A", docHash: "00", lphone: "" };
    try {
      const jsonStr = atob(rawB64.replace(/-/g, '+').replace(/_/g, '/'));
      contract = JSON.parse(jsonStr);
    } catch (e) {}

    document.getElementById("contractDetails").innerHTML = `
      <div class="doc-grid">
        <div><span>Tenant Name:</span><br><strong>${contract.name}</strong></div>
        <div><span>Assigned Unit:</span><br><strong>Room ${contract.room}</strong></div>
        <div><span>Monthly Rent:</span><br><strong>₹${contract.rent}</strong></div>
        <div><span>Security Deposit:</span><br><strong>₹${contract.deposit}</strong></div>
      </div>

      <div class="document-paper">
        <h4>Terms & Conditions of Lease</h4>
        <p><strong>1. Engagement & Term:</strong> This Residential Lease Agreement is entered into by and between the Landlord and the Tenant named herein, for the designated room property managed via RentMS.</p>
        <p><strong>2. Financial Obligations:</strong> The Tenant agrees to pay the stipulated Monthly Rent on or before the designated due date. The Security Deposit shall be held securely in the tenant vault pool and is refundable upon standard lease termination subject to clearance of utility arrears and property inspections.</p>
        <p><strong>3. Compliance & Maintenance:</strong> The Tenant accepts full responsibility for maintaining the premises in good order, observing community guidelines, and ensuring timely clearance of metered utility allocations (Electricity, Water, PNG).</p>
        <p><strong>4. Legal Validity:</strong> Backed by E-Stamp reference <strong>${contract.estamp}</strong>, this document is bound electronically under the provisions of the Information Technology Act, 2000, utilizing cryptographic SHA-256 digital verification hashes.</p>
      </div>

      <div style="font-size: 0.78rem; color: #64748b; font-family: monospace; text-align: center; margin-bottom: 4px;">
        Document SHA-256 Hash: ${(contract.docHash || "").substring(0, 24)}...
      </div>
    `;

    let tapTimes = [];
    let numA = 0, numB = 0;
    const tapBox = document.getElementById("tapBox");
    const tapStatus = document.getElementById("tapStatus");

    function handleTap(e) {
      e.preventDefault();
      const now = performance.now();
      tapTimes = tapTimes.filter(t => now - t < 850);
      tapTimes.push(now);
      tapStatus.textContent = "Taps: " + tapTimes.length + " / 3";
      if (tapTimes.length >= 3) {
        tapTimes = [];
        numA = Math.floor(Math.random() * 14) + 5;
        numB = Math.floor(Math.random() * 9) + 3;
        document.getElementById("mathPrompt").textContent = numA + " + " + numB + " = ?";
        document.getElementById("captchaInput").value = "";
        document.getElementById("captchaModal").style.display = "flex";
        document.getElementById("captchaInput").focus();
      }
    }

    tapBox.addEventListener("touchend", handleTap, { passive: false });
    tapBox.addEventListener("click", handleTap);

    document.getElementById("verifyBtn").addEventListener("click", async () => {
      const ans = parseInt(document.getElementById("captchaInput").value, 10);
      if (ans !== (numA + numB)) {
        alert("Incorrect answer. Please solve the math challenge.");
        return;
      }

      document.getElementById("captchaModal").style.display = "none";
      tapBox.style.display = "none";

      const timestamp = new Date().toISOString();
      const captchaToken = "SOLVED_" + numA + "_PLUS_" + numB + "_EQ_" + ans;
      const rawStr = contract.docHash + "|" + timestamp + "|" + captchaToken;

      const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(rawStr));
      const sigHex = Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');

      const returnPacket = {
        tenantId: contract.tenantId,
        sigToken: sigHex,
        timestamp: timestamp,
        deviceMeta: navigator.userAgent.substring(0, 60),
        captchaToken: captchaToken
      };

      const encodedPayload = btoa(JSON.stringify(returnPacket)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
      const baseUrl = window.location.origin + window.location.pathname;
      const landlordVerifyUrl = baseUrl + "?verify=" + encodedPayload;
      const directDeepLink = "rentms://sign-callback?payload=" + encodedPayload;

      const waMsg = encodeURIComponent(
        "✓ *Lease Signed & Verified (Room " + contract.room + ")*\n" +
        "Tenant: " + contract.name + "\n" +
        "Seal Hash: " + sigHex.substring(0, 16) + "...\n\n" +
        "Tap below on Landlord device to import into RentMS & apply Hardware Seal:\n" +
        landlordVerifyUrl
      );

      const waTarget = contract.lphone ? "https://wa.me/" + contract.lphone + "?text=" + waMsg : "https://wa.me/?text=" + waMsg;

      const banner = document.getElementById("sealedBanner");
      banner.style.display = "block";
      banner.innerHTML = `
        ✓ Signature & Captcha Locked!<br/>
        <span style="font-size:0.78rem; font-weight:normal;">SHA-256 Seal: ${sigHex.substring(0, 20)}...</span>
        <button class="btn-emerald" onclick="window.location.href='${waTarget}'">
          Send Signed Confirmation via WhatsApp
        </button>
        <button style="background:#475569; margin-top:8px;" onclick="window.location.href='${directDeepLink}'">
          Signing on Landlord's Phone? Import Directly
        </button>
      `;

      // Automatically trigger WhatsApp handoff to landlord
      window.location.href = waTarget;
    });
  }
</script>
</body>
</html>
